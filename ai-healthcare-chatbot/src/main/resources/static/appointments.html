<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Appointment - AI Healthcare</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div id="navbar-root"></div><main class="page"><h1>📅 Book an Appointment</h1><section class="panel"><form id="appointmentForm" class="form-grid"><input id="patientName" maxlength="100" placeholder="Patient name" required><input id="patientEmail" type="email" maxlength="150" placeholder="Email (login email is used automatically)"><select id="doctorName" required><option value="">Select doctor</option></select><input id="appointmentDate" type="date" required><select id="appointmentTime" required disabled><option value="">Select doctor and date first</option></select><textarea id="reason" maxlength="500" placeholder="Reason for visit (optional)"></textarea><div class="form-actions"><button type="submit">Confirm Appointment</button><button type="button" id="cancelAppointment" class="secondary">Clear Form</button></div><div id="appointmentResult"></div></form></section></main><footer>AI Healthcare Chatbot • Demo project</footer></div><script src="common.js"></script><script src="appointments.js"></script></body></html>
