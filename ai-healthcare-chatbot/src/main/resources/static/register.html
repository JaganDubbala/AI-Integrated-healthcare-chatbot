<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register - AI Healthcare</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<nav class="navbar">
			<a class="brand" href="register.html">🏥 AI Healthcare</a>
			<div class="nav-links">
				<a href="login.html">Login</a>
			</div>
		</nav>
		<main class="page">
			<section class="auth-card">
				<h1>👤 Create Account</h1>
				<form id="registerForm" class="form-grid">
					<input id="name" maxlength="100" placeholder="Full name" required><input
						id="email" type="email" maxlength="150" placeholder="Email"
						required><input id="phone" maxlength="20"
						placeholder="Phone"><input id="password" type="password"
						minlength="6" maxlength="100"
						placeholder="Password (minimum 6 characters)" required><input
						id="confirmPassword" type="password"
						minlength="6" maxlength="100"
						placeholder="Confirm password" required>
					<button type="submit">Register</button>
					<div id="registerResult" class="error"></div>
				</form>
				<p>
					Already registered? <a href="login.html">Login</a>
				</p>
			</section>
		</main>
	</div>
	<script src="auth.js"></script>
</body>
</html>
