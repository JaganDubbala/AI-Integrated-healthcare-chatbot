<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hospitals - Admin - AI Healthcare</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div id="navbar-root"></div><main class="page"><h1>🏥 Hospitals</h1><div id="adminMessage" class="warning hidden"></div><section class="panel"><h2 id="hospitalFormTitle">➕ Add Hospital</h2><form id="hospitalForm" class="form-grid"><input type="hidden" id="hospitalId"><input id="hospitalName" maxlength="150" placeholder="Name" required><input id="hospitalCity" maxlength="100" placeholder="City" required><input id="hospitalArea" maxlength="100" placeholder="Area"><input id="hospitalAddress" maxlength="250" placeholder="Address"><input id="hospitalPhone" maxlength="20" placeholder="Phone"><input id="hospitalSpecialties" maxlength="250" placeholder="Specialties (comma separated)"><div class="form-actions"><button type="submit" id="hospitalSubmitBtn">Add Hospital</button><button type="button" id="hospitalCancelEdit" class="secondary hidden">Cancel edit</button></div><div id="hospitalFormResult"></div></form></section><section class="panel"><h2>📋 All Hospitals</h2><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>City</th><th>Area</th><th>Address</th><th>Phone</th><th>Specialties</th><th>Actions</th></tr></thead><tbody id="hospitalsBody"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></section></main></div><script src="common.js"></script><script src="admin-hospitals.js"></script></body></html>
