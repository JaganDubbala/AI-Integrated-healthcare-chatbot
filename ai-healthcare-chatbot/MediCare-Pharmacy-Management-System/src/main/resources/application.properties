# ===== Server =====
server.port=8080

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/medicare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Static resources (frontend) =====
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ===== Logging =====
logging.level.com.medicare=INFO
logging.level.org.springframework.security=INFO
