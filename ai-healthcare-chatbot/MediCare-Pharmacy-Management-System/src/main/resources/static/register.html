<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediCare - Register</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-mount"></div>

<div class="page">
  <div class="container-narrow">
    <div class="card auth-card">
      <h2 class="section-title">Create your account</h2>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" />
          <div class="field-error" id="name-error"></div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" />
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" class="form-control" placeholder="10 digit number" />
            <div class="field-error" id="phone-error"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="At least 6 characters" />
            <div class="field-error" id="password-error"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" class="form-control" placeholder="Delivery address"></textarea>
          <div class="field-error" id="address-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-btn">Register</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="/login.html">Login here</a></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
