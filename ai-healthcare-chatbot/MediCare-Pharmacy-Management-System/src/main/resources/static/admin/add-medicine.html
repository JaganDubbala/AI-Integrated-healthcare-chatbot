<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediCare Admin - Add Medicine</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-mount"></div>

<div class="admin-layout">
  <div id="sidebar-mount"></div>
  <main class="admin-content">
    <a href="/admin/manage-medicines.html" class="btn btn-outline btn-sm mb-16">&larr; Back to Medicines</a>
    <div class="card" style="max-width:640px;">
      <h1 class="section-title">Add New Medicine</h1>
      <form id="medicine-form" novalidate>
        <div class="form-group">
          <label for="name">Medicine Name</label>
          <input type="text" id="name" class="form-control" />
          <div class="field-error" id="name-error"></div>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" class="form-control"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" class="form-control" placeholder="e.g. Painkiller" />
            <div class="field-error" id="category-error"></div>
          </div>
          <div class="form-group">
            <label for="manufacturer">Manufacturer</label>
            <input type="text" id="manufacturer" class="form-control" />
            <div class="field-error" id="manufacturer-error"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="price">Price (&#8377;)</label>
            <input type="number" id="price" class="form-control" step="0.01" min="0.01" />
            <div class="field-error" id="price-error"></div>
          </div>
          <div class="form-group">
            <label for="stockQuantity">Stock Quantity</label>
            <input type="number" id="stockQuantity" class="form-control" min="0" />
            <div class="field-error" id="stockQuantity-error"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="expiryDate">Expiry Date</label>
          <input type="date" id="expiryDate" class="form-control" />
          <div class="field-error" id="expiryDate-error"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="save-btn">Add Medicine</button>
      </form>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/admin-sidebar.js"></script>
<script src="/js/admin-add-medicine.js"></script>
</body>
</html>
