<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediCare - Login</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-mount"></div>

<div class="page">
  <div class="container-narrow">
    <div class="card auth-card">
      <h2 class="section-title">Login to MediCare</h2>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="identifier">Email (customer) or Username (admin)</label>
          <input type="text" id="identifier" class="form-control" placeholder="Enter email or admin username" />
          <div class="field-error" id="identifier-error"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" />
          <div class="field-error" id="password-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
      </form>
      <div class="auth-switch">New to MediCare? <a href="/register.html">Create an account</a></div>
      <div class="auth-switch text-muted" style="margin-top:20px;font-size:0.8rem;">
        Sample admin login: <b>admin</b> / <b>Admin@123</b>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
