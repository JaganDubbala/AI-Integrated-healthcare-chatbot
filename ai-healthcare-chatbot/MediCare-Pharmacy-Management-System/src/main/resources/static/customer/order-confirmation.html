<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediCare - Order Confirmed</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-mount"></div>

<div class="page">
  <div class="container-narrow">
    <div class="card text-center">
      <div style="font-size:3rem;">&#9989;</div>
      <h2 class="section-title" style="text-align:center;">Order Placed Successfully!</h2>
      <p class="text-muted" id="order-summary-text"></p>
      <div class="flex gap-12" style="justify-content:center;margin-top:20px;">
        <a href="/customer/my-orders.html" class="btn btn-primary">View My Orders</a>
        <a href="/customer/catalog.html" class="btn btn-outline">Continue Shopping</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/navbar.js"></script>
<script>
  const session = requireRole("CUSTOMER");
  if (session) {
    renderNavbar("orders");
    const raw = sessionStorage.getItem("medicare_last_order");
    const el = document.getElementById("order-summary-text");
    if (raw) {
      const order = JSON.parse(raw);
      el.textContent = "Order #" + order.id + " for " + formatCurrency(order.totalAmount) + " has been placed and is now " + order.status + ".";
    } else {
      el.textContent = "Your order has been placed.";
    }
  }
</script>
</body>
</html>
