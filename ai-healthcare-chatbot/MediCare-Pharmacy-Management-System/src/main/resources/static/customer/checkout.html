<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediCare - Checkout</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar-mount"></div>

<div class="page">
  <div class="container-narrow">
    <h1 class="section-title">Checkout</h1>
    <div class="card">
      <h3 class="section-title">Delivery Address</h3>
      <p id="delivery-address" class="text-muted"></p>

      <h3 class="section-title">Order Items</h3>
      <div id="checkout-items"></div>

      <div class="cart-summary total"><span>Total Amount</span><span id="checkout-total">&#8377;0.00</span></div>

      <button class="btn btn-primary btn-block mt-16" id="place-order-btn">Place Order</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
